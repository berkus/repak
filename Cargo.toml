[package]
name = "repak"
version = "0.1.0"
authors = ["Berkus Decker <berkus+crates@metta.systems>"]
description = "REPAK asset library format support"
edition = "2024"
repository = "https://github.com/berkus/repak"
license = "MIT OR Apache-2.0"
keywords = ["games", "assets"]
categories = [
    "filesystem",
    "development-tools",
    "game-development",
    "parser-implementations",
]

[features]
default = [
    "dep:flate2",
    "dep:twox-hash",
    "dep:tiny-keccak",
    "dep:seahash",
    "dep:blake3",
    "dep:cityhash-rs",
]
all-compression = [
    "dep:flate2",
    "dep:bzip2",
    "dep:zstd",
    "dep:xz2",
    "dep:lz4",
]

[dependencies]
blake3 = { version = "1.7", optional = true }
bzip2 = { version = "0.4", optional = true }
byteorder = "1.5.0"
cityhash-rs = { version = "1.0", optional = true }
culpa = "1.0.2"
flate2 = { version = "1.1", optional = true }
leb128 = "0.2.5"
lz4 = { version = "1.24", optional = true }
seahash = { version = "4.1", optional = true }
tempfile = "3.10.1"
thiserror = "2.0.11"
tiny-keccak = { version = "2.0", features = ["sha3", "k12"], optional = true }
twox-hash = { version = "2.1", features = ["xxhash3_128"], optional = true }
xz2 = { version = "0.1", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
anyhow = "1.0.95"
argh = "0.1.13"
serde = "1.0.217"
serde_json = "1.0.138"
