[package]
name = "repak"
version = "0.1.0"
authors = ["Berkus Decker <berkus+crates@metta.systems>"]
description = "REPAK asset library format support"
edition = "2024"
repository = "https://github.com/berkus/repak"
license = "MIT OR Apache-2.0"
keywords = ["games", "assets"]
categories = [
    "filesystem",
    "development-tools",
    "game-development",
    "parser-implementations",
]

[dependencies]
blake3 = "1.7.0"
byteorder = "1.5.0"
cityhash-rs = "1.0.1"
culpa = "1.0.2"
# fasthash = "0.4.0" # doesn't build on macOS
flate2 = { version = "1.1.0" }                                # , optional = true
leb128 = "0.2.5"
seahash = "4.1.0"
thiserror = "2.0.11"
tiny-keccak = { version = "2.0", features = ["sha3", "k12"] }
twox-hash = "2.1.0"

[dev-dependencies]
anyhow = "1.0.95"
argh = "0.1.13"
serde = "1.0.217"
serde_json = "1.0.138"
